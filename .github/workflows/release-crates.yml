name: Release (crates.io)

# Tag with `v0.X.Y` to publish the Rust crate to crates.io. Bump
# `rotorvec/Cargo.toml` `version` before tagging.
#
# Auth: uses the `CARGO_REGISTRY_TOKEN` repository secret. Generate a
# token at https://crates.io → Account Settings → API Tokens (scope:
# publish-new + publish-update) and add it under
# Settings → Secrets and variables → Actions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io/crates/rotorvec
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish rotorvec
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rotorvec

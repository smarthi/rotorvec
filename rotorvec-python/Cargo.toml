[package]
name = "rotorvec-python"
version = "0.2.2"
description = "Python bindings for rotorvec — Clifford-rotor block-diagonal vector quantization"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_rotorvec"
crate-type = ["cdylib"]

[dependencies]
rotorvec-core = { package = "rotorvec", path = "../rotorvec" }
pyo3 = { version = "0.27.0", features = ["extension-module", "abi3-py310"] }
numpy = "0.27.0"

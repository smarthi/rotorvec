[package]
name = "rotorvec-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Recall and throughput benchmarks for rotorvec"

[[bin]]
name = "rotorvec-bench"
path = "src/main.rs"

[dependencies]
rotorvec = { path = "../rotorvec" }
turbovec = "0.2"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

# turbovec calls into BLAS (sgemm) for its dense d×d rotation. The link
# directive only propagates when blas-src is a direct dep of the final
# binary, so re-declare it here per-target.
[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
blas-src = { version = "0.10", features = ["openblas"] }
openblas-src = { version = "0.10", default-features = false, features = ["system"] }
